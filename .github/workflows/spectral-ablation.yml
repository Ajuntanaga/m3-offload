name: Cross-fitted pitch-group power ablation
run-name: 'Spectral ablation / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source commit for one spectral ablation feasibility screen
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/ablation-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin source and CPU dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/ablation-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/ablation-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 soundfile==0.13.1 2>&1 | tee "$GITHUB_WORKSPACE/ablation-logs/dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/ablation-logs/environment.txt"
      - name: Check synthetic source isolation, waveform, clock and scoring behavior
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_spectral_ablation tests.test_portable_spectral_ablation tests.test_spectral_dictionary tests.test_direct_spectrum_learning tests.test_portable_direct_spectrum_learning tests.test_pitch_detector_comparison 2>&1 | tee "$GITHUB_WORKSPACE/ablation-logs/tests.log"
      - name: Build and screen one frozen dictionary; continuous replay only after held-out pass
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.portable_spectral_ablation \
            --spec docs/recovery/spectral-ablation-20261121.json \
            --output "$GITHUB_WORKSPACE/spectral-ablation-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/ablation-logs/screen.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-spectral-ablation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spectral-ablation-result/report/
            spectral-ablation-result/logs/
            ablation-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain model and predictions remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-spectral-ablation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: spectral-ablation-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
