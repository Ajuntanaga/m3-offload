name: Unchanged Basic Pitch operator profile
run-name: 'Basic Pitch operator profile / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen synthetic operator-profile source
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-basic-pitch-operator-profile
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/basic-pitch-operator-profile-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin source and CPU runtime dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/basic-pitch-operator-profile-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/basic-pitch-operator-profile-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 soundfile==0.13.1 onnxruntime==1.20.1 onnx==1.17.0 2>&1 | tee "$GITHUB_WORKSPACE/basic-pitch-operator-profile-logs/dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/basic-pitch-operator-profile-logs/environment.txt"
      - name: Check protocol and failure gates
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_basic_pitch_operator_profile 2>&1 | tee "$GITHUB_WORKSPACE/basic-pitch-operator-profile-logs/tests.log"
      - name: Profile unchanged graphs on synthetic inputs
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 10m \
            python -m tools.portable_basic_pitch_operator_profile \
            --spec docs/recovery/basic-pitch-operator-profile-20261122.json \
            --output "$GITHUB_WORKSPACE/basic-pitch-operator-profile-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/basic-pitch-operator-profile-logs/comparison.log"
      - name: Retain compact report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-basic-pitch-operator-profile-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            basic-pitch-operator-profile-result/report/
            basic-pitch-operator-profile-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain raw operator traces remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-basic-pitch-operator-profile-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: basic-pitch-operator-profile-result/bulk/
          retention-days: 14
          if-no-files-found: warn
