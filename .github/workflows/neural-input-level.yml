name: M3 saved neural output and causal input level
run-name: 'M3 input level / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit with the frozen causal level observation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  INPUT_TAG: corpus-20261108
  INPUT_SHA256: adf6e36f2883538cfa3b0500ca0d936ed64fc6a1e12aeae3bd89e40dbf7c4254
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/input-level-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Record source and install level-reading dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/input-level-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/input-level-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 soundfile==0.12.1 2>&1 | tee "$GITHUB_WORKSPACE/input-level-logs/dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/input-level-logs/environment.txt"
      - name: Check synthetic causal clocks and occupancy accounting
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_neural_input_level 2>&1 | tee "$GITHUB_WORKSPACE/input-level-logs/tests.log"
      - name: Download existing pinned inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-inputs"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern recovery-inputs.tar.gz --dir "$RUNNER_TEMP/m3-inputs" > "$GITHUB_WORKSPACE/input-level-logs/input-download.log" 2>&1
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" | sha256sum --check | tee "$GITHUB_WORKSPACE/input-level-logs/input-hash.log"
          tar -xzf "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" -C "$RUNNER_TEMP/m3-inputs"
      - name: Observe input level against saved delivered MIDI
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          set -euo pipefail
          python -m tools.portable_neural_input_level \
            --spec docs/recovery/neural-input-level-20261121.json \
            --inputs "$RUNNER_TEMP/m3-inputs" \
            --output "$GITHUB_WORKSPACE/neural-input-level-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/input-level-logs/observation.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-neural-input-level-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            neural-input-level-result/report/
            neural-input-level-result/logs/
            input-level-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain level tables remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-neural-input-level-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: neural-input-level-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
