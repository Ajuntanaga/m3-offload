name: Batch cell production-shaped REAPER pair
run-name: 'Batch cell REAPER pair / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source for one scalar and one batch host observation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p host-logs
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record source pin and test report logic
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/host-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/host-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m unittest tests.test_batch_cell_host 2>&1 | tee "$GITHUB_WORKSPACE/host-logs/report-tests.log"
      - name: Install isolated build and host dependencies
        timeout-minutes: 16
        run: |
          set -euo pipefail
          # The previous job exhausted its deadline retrying the regional HTTP mirror.
          test -f /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt > host-logs/apt-mirrors-original.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' \
            | sudo tee /etc/apt/apt-mirrors.txt | tee host-logs/apt-mirrors-selected.txt
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 -o Acquire::Languages=none)
          sudo timeout --kill-after=15s 300s apt-get "${apt_options[@]}" \
            -o APT::Update::Error-Mode=any update 2>&1 | tee host-logs/apt-update.log
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 600s \
            apt-get "${apt_options[@]}" install -y --no-install-recommends \
            jackd2 jack-tools xvfb xauth x11-utils lua5.4 libgtk-3-0t64 \
            libasound2t64 libx11-6 libxext6 libxi6 libxrender1 libfontconfig1 libfreetype6 \
            libexpat1-dev libglib2.0-dev libcairo2-dev libfontconfig1-dev \
            libfreetype6-dev libpango1.0-dev libwayland-dev libgtkmm-3.0-dev \
            libatkmm-1.6-dev libsqlite3-dev pkg-config wayland-protocols \
            libx11-dev libx11-xcb-dev libxcb-cursor-dev libxcb-keysyms1-dev \
            libxcb-util-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            2>&1 | tee host-logs/apt-install.log
      - name: Build production-shaped pair and native tests
        working-directory: source
        run: |
          set -euo pipefail
          cmake -S . -B build/batch-host -DCMAKE_BUILD_TYPE=Release \
            -DM3_BUILD_BATCH_CELL_LAB=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee "$GITHUB_WORKSPACE/host-logs/configure.log"
          cmake --build build/batch-host --parallel 2 --target \
            m3_vst3_production m3_vst3_batch_cell_lab m3_native_tests \
            m3_vst3_realtime_tests m3_batch_cell_realtime_tests \
            2>&1 | tee "$GITHUB_WORKSPACE/host-logs/build.log"
      - name: Native allocation and timing suites and package validators
        working-directory: source
        run: |
          set -euo pipefail
          ctest --test-dir build/batch-host --output-on-failure \
            -R '^(m3_native_tests|m3_vst3_realtime_tests|m3_batch_cell_realtime_tests)$' \
            2>&1 | tee "$GITHUB_WORKSPACE/host-logs/native-tests.log"
          cmake --build build/batch-host --target m3_validate_batch_cell_pair --parallel 2 \
            2>&1 | tee "$GITHUB_WORKSPACE/host-logs/validators.log"
      - name: Compare scalar and batch in real REAPER
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.portable_batch_cell_host \
            --spec docs/recovery/batch-cell-lab-host-20261123.json \
            --build build/batch-host --output "$GITHUB_WORKSPACE/batch-host-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/host-logs/observation.log"
      - name: Retain small report and build host logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-batch-cell-host-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            batch-host-result/report/
            batch-host-result/logs/
            host-logs/
            source/build/batch-host/Testing/Temporary/LastTest.log
            source/build/batch-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
          if-no-files-found: error
      - name: Retain uninstalled bundles and host events remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-batch-cell-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: batch-host-result/bulk/
          retention-days: 14
          if-no-files-found: warn
