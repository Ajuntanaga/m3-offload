name: Harmonic pitch-scaled windows screen
run-name: 'Harmonic pitch-scaled windows / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source commit for one harmonic pitch-scaled windows screen
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin source and CPU dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 scikit-learn==1.7.2 joblib==1.5.2 soundfile==0.13.1 2>&1 | tee "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs/dependencies.log"
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs/torch-dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs/environment.txt"
      - name: Check pitch-scaled windows, singleton preservation, model persistence and scoring
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_harmonic_pitch_scaled_windows tests.test_harmonic_phase_motion tests.test_harmonic_peak_contrast tests.test_harmonic_pitch_transposition tests.test_harmonic_source_variation tests.test_harmonic_setwise_learning tests.test_harmonic_complete_set_learning tests.test_harmonic_context_learning tests.test_portable_harmonic_context_learning tests.test_shared_harmonic_learning tests.test_direct_spectrum_learning tests.test_portable_direct_spectrum_learning tests.test_spectral_dictionary tests.test_spectral_ablation tests.test_pitch_detector_comparison 2>&1 | tee "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs/tests.log"
      - name: Fit one shared classifier; continuous replay only after held-out pass
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.portable_harmonic_context_learning \
            --spec docs/recovery/harmonic-pitch-scaled-windows-20261122.json \
            --output "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/harmonic-pitch-scaled-windows-logs/screen.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-harmonic-pitch-scaled-windows-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            harmonic-pitch-scaled-windows-result/report/
            harmonic-pitch-scaled-windows-result/logs/
            harmonic-pitch-scaled-windows-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain model and predictions remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-harmonic-pitch-scaled-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: harmonic-pitch-scaled-windows-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
