name: M3 native joint rapid release
run-name: 'Joint rapid reset / ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full frozen source commit in Ajuntanaga/polyphonic-audio-to-midi
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: m3-private-processing
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  INPUT_TAG: corpus-20261108
  INPUT_SHA256: adf6e36f2883538cfa3b0500ca0d936ed64fc6a1e12aeae3bd89e40dbf7c4254
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check destination and source selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify the frozen input bundle
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/m3-inputs" build/github-results
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern recovery-inputs.tar.gz --dir "$RUNNER_TEMP/m3-inputs"
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" -C "$RUNNER_TEMP/m3-inputs"
          rm "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          original = Path(os.environ['RUNNER_TEMP']) / 'm3-inputs/recovery-inputs.json'
          manifest = json.loads(original.read_text())
          manifest['source'] = dict(repository='Ajuntanaga/polyphonic-audio-to-midi',
              commit=os.environ['SOURCE_SHA'], provider='github-actions',
              worker_repository=os.environ['GITHUB_REPOSITORY'],
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              input_release=os.environ['INPUT_TAG'], input_bundle_sha256=os.environ['INPUT_SHA256'],
              original_input_manifest_sha256=hashlib.sha256(original.read_bytes()).hexdigest())
          Path('build/github-results/runtime-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Check support clock and screen contracts
        working-directory: source
        run: |
          python3 -B -m unittest tests.test_portable_joint_rapid_reset 2>&1 | tee build/github-results/contracts.log
      - name: Build portable native tests and replay
        working-directory: source
        run: |
          cmake -S cloud/native -B build/joint-native -DCMAKE_BUILD_TYPE=Release -DM3_OFFLINE_ALLOCATION_TRACE=OFF -DM3_OFFLINE_STAGE_TIMING=OFF 2>&1 | tee build/github-results/configure.log
          cmake --build build/joint-native --target m3_replay m3_motion_tests m3_detector_tests --parallel 2 2>&1 | tee build/github-results/build.log
      - name: Run native support and lifecycle tests
        working-directory: source
        run: |
          ctest --test-dir build/joint-native --output-on-failure 2>&1 | tee build/github-results/native-tests.log
      - name: Run the frozen two-recording causal screen
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          python3 -B -m tools.portable_joint_rapid_reset \
            --binary build/joint-native/m3_replay \
            --corpus "$RUNNER_TEMP/m3-inputs/corpus" \
            --manifest build/github-results/runtime-manifest.json \
            --spec docs/recovery/joint-rapid-reset-spec-20261122.json \
            --output build/github-results/joint-rapid-reset 2>&1 | tee build/github-results/runner.log
      - name: Keep small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-joint-rapid-reset-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            source/build/github-results/*.json
            source/build/github-results/*.log
            source/build/github-results/joint-rapid-reset/report/
      - name: Keep compressed snapshot and MIDI evidence remote
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-joint-rapid-reset-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
          path: source/build/github-results/joint-rapid-reset/bulk/
