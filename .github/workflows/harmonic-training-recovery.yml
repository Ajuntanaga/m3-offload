name: Harmonic training recovery screen
run-name: 'Harmonic training recovery / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source commit for one resumable spectral-patch experiment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/harmonic-training-recovery-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin source and CPU dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/harmonic-training-recovery-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/harmonic-training-recovery-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 scikit-learn==1.7.2 joblib==1.5.2 soundfile==0.13.1 2>&1 | tee "$GITHUB_WORKSPACE/harmonic-training-recovery-logs/dependencies.log"
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee "$GITHUB_WORKSPACE/harmonic-training-recovery-logs/torch-dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/harmonic-training-recovery-logs/environment.txt"
      - name: Verify interrupted/resumed training identity and original scientific tests
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_harmonic_training_checkpoint tests.test_harmonic_spectral_patches tests.test_harmonic_pitch_scaled_windows tests.test_harmonic_phase_motion tests.test_harmonic_peak_contrast tests.test_harmonic_pitch_transposition tests.test_harmonic_source_variation tests.test_harmonic_setwise_learning tests.test_harmonic_complete_set_learning tests.test_harmonic_context_learning tests.test_portable_harmonic_context_learning tests.test_shared_harmonic_learning tests.test_direct_spectrum_learning tests.test_portable_direct_spectrum_learning tests.test_spectral_dictionary tests.test_spectral_ablation tests.test_pitch_detector_comparison 2>&1 | tee "$GITHUB_WORKSPACE/harmonic-training-recovery-logs/tests.log"
      - name: Execute frozen experiment with epoch checkpoints and a bounded recovery window
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 105m \
            python -m tools.portable_harmonic_training_recovery \
            --execution-spec docs/recovery/harmonic-training-recovery-20261122.json \
            --output "$GITHUB_WORKSPACE/harmonic-training-recovery-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/harmonic-training-recovery-logs/screen.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-harmonic-training-recovery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            harmonic-training-recovery-result/report/
            harmonic-training-recovery-result/logs/
            harmonic-training-recovery-result/checkpoint/*.json
            harmonic-training-recovery-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain last complete epoch for interruption recovery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-harmonic-training-recovery-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: harmonic-training-recovery-result/checkpoint/training-state.pt
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
      - name: Retain model and predictions remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-harmonic-training-recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: harmonic-training-recovery-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
