name: M3 spectral sparsity attack
run-name: 'Spectral sparsity attack / ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full pinned standalone feature commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: m3-spectral-sparsity-attack
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check destination and source selection
        run: |
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare the pinned numerical runtime
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p build/github-results
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'soundfile==0.13.1' 2>&1 | tee build/github-results/spectral-sparsity-dependencies.log
      - name: Fetch existing copied-note fixtures
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Ajuntanaga/m3-offload/actions/artifacts/14807523635/zip > "$RUNNER_TEMP/m3-repluck-report.zip"
          printf '%s  %s\n' e25f1423410ebfaff7eed59cdc8b9761e5972399fc0ea91d2e1056bd70067ff3 "$RUNNER_TEMP/m3-repluck-report.zip" | sha256sum --check
          gh api repos/Ajuntanaga/m3-offload/actions/artifacts/14808656500/zip > "$RUNNER_TEMP/m3-repluck-evidence.zip"
          printf '%s  %s\n' 4a89a38f2293bd0934af149b51470f93fd052278fb0db5f991ce69a0e316a518 "$RUNNER_TEMP/m3-repluck-evidence.zip" | sha256sum --check
      - name: Test feature, clock and threshold contracts
        working-directory: source
        run: |
          python -B -m unittest tests.test_spectral_sparsity_attack tests.test_complex_attack_baseline 2>&1 | tee build/github-results/spectral-sparsity-contracts.log
      - name: Run calibration followed by frozen transfer
        working-directory: source
        run: |
          python -B -m tools.portable_spectral_sparsity_attack \
            --source-sha "$SOURCE_SHA" \
            --spec docs/recovery/spectral-sparsity-attack-20261123.json \
            --report-archive "$RUNNER_TEMP/m3-repluck-report.zip" \
            --evidence-archive "$RUNNER_TEMP/m3-repluck-evidence.zip" \
            --output build/github-results/spectral-sparsity-attack \
            2>&1 | tee build/github-results/spectral-sparsity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-spectral-sparsity-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            source/build/github-results/spectral-sparsity-attack/report.json
            source/build/github-results/spectral-sparsity*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-spectral-sparsity-features-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: source/build/github-results/spectral-sparsity-attack/*-features.json.gz
