name: FretNet offline comparison
run-name: 'FretNet comparison / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit containing the frozen comparison
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  INPUT_TAG: corpus-20261108
  INPUT_SHA256: adf6e36f2883538cfa3b0500ca0d936ed64fc6a1e12aeae3bd89e40dbf7c4254
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/comparison-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        working-directory: source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tools/fretnet_requirements.txt 2>&1 | tee "$GITHUB_WORKSPACE/comparison-logs/dependencies.log"
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu 2>&1 | tee "$GITHUB_WORKSPACE/comparison-logs/torch.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/comparison-logs/environment.txt"
      - name: Check synthetic scoring and runner contracts
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/comparison-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/comparison-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m unittest tests.test_fretnet_comparison tests.test_pitch_detector_comparison tests.test_midi_lifecycle_analysis 2>&1 | tee "$GITHUB_WORKSPACE/comparison-logs/tests.log"
      - name: Download existing pinned inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-inputs"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern recovery-inputs.tar.gz --dir "$RUNNER_TEMP/m3-inputs" > "$GITHUB_WORKSPACE/comparison-logs/input-download.log" 2>&1
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" | sha256sum --check | tee "$GITHUB_WORKSPACE/comparison-logs/input-hash.log"
          tar -xzf "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" -C "$RUNNER_TEMP/m3-inputs"
      - name: Compare once after reference identity checks
        working-directory: source
        run: |
          set -euo pipefail
          python -m tools.portable_fretnet_comparison \
            --spec docs/recovery/fretnet-comparison-20261123.json \
            --inputs "$RUNNER_TEMP/m3-inputs" \
            --output "$GITHUB_WORKSPACE/fretnet-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/comparison-logs/comparison.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-fretnet-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fretnet-result/report/
            comparison-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Keep model outputs remote
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-fretnet-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: fretnet-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
