name: Audio level curves at label ends
run-name: 'Audio level curves / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Pinned source commit of the registered audio-level read of label ends (CPU, no model)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-audio-release-levels
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  INPUT_TAG: corpus-20261108
  INPUT_SHA256: adf6e36f2883538cfa3b0500ca0d936ed64fc6a1e12aeae3bd89e40dbf7c4254
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'

jobs:
  levels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/audio-release-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin source and install the two numerical dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/audio-release-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/audio-release-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 soundfile==0.12.1 2>&1 | tee "$GITHUB_WORKSPACE/audio-release-logs/dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/audio-release-logs/environment.txt"
      - name: Verify the measurement checks before any audio is read
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_audio_release_levels 2>&1 | tee "$GITHUB_WORKSPACE/audio-release-logs/tests.log"
      - name: Download existing pinned inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-inputs"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern recovery-inputs.tar.gz --dir "$RUNNER_TEMP/m3-inputs" > "$GITHUB_WORKSPACE/audio-release-logs/input-download.log" 2>&1
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" | sha256sum --check | tee "$GITHUB_WORKSPACE/audio-release-logs/input-hash.log"
          tar -xzf "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" -C "$RUNNER_TEMP/m3-inputs"
      - name: Measure the level curves once
        working-directory: source
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 15m \
            python -m tools.portable_audio_release_levels \
            --spec docs/recovery/audio-release-levels-20261122.json \
            --inputs "$RUNNER_TEMP/m3-inputs" \
            --output "$GITHUB_WORKSPACE/audio-release-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/audio-release-logs/measure.log"
      - name: Retain the small report, curves and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-audio-release-levels-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audio-release-result/report/
            audio-release-logs/
          retention-days: 14
          if-no-files-found: error
