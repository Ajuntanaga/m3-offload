name: Targeted source pitch verification
run-name: 'Source pitch verification / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source commit for one frozen targeted source verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/source-verification-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin source and CPU dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/source-verification-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/source-verification-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 soundfile==0.13.1 2>&1 | tee "$GITHUB_WORKSPACE/source-verification-logs/dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/source-verification-logs/environment.txt"
      - name: Check estimator, source inventory and remote guard on synthetic data
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_source_pitch_verification -v 2>&1 | tee "$GITHUB_WORKSPACE/source-verification-logs/tests.log"
      - name: Measure full selected takes without fitting or relabeling
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.portable_source_pitch_verification \
            --spec docs/recovery/source-pitch-verification-20261121.json \
            --output "$GITHUB_WORKSPACE/source-pitch-verification-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/source-verification-logs/diagnostic.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-source-pitch-verification-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-pitch-verification-result/report/
            source-pitch-verification-result/logs/
            source-verification-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain harmonic spectra remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-source-pitch-verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-pitch-verification-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
