name: Basic Pitch native worker feasibility
run-name: 'Basic Pitch native / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source commit containing the native causal worker
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  INPUT_TAG: corpus-20261108
  INPUT_SHA256: adf6e36f2883538cfa3b0500ca0d936ed64fc6a1e12aeae3bd89e40dbf7c4254
  MODEL_SHA: fa5997af0a8210982619003269994a1be25eddf3
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/native-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: spotify/basic-pitch
          ref: fa5997af0a8210982619003269994a1be25eddf3
          path: basic-pitch
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Record source and model pins
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/native-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/native-logs/source-sha.txt")" = "$SOURCE_SHA"
          git -C "$GITHUB_WORKSPACE/basic-pitch" rev-parse HEAD > "$GITHUB_WORKSPACE/native-logs/model-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/native-logs/model-sha.txt")" = "$MODEL_SHA"
      - name: Install pinned numerical scoring dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 2>&1 | tee "$GITHUB_WORKSPACE/native-logs/dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/native-logs/environment.txt"
      - name: Obtain pinned CPU SDK and record archive hash
        run: |
          set -euo pipefail
          sdk_url=$(python -c 'import json; print(json.load(open("source/docs/recovery/basic-pitch-native-20261121.json"))["sdk"]["url"])')
          curl --fail --location --max-time 180 "$sdk_url" --output "$RUNNER_TEMP/onnxruntime.nupkg" > "$GITHUB_WORKSPACE/native-logs/sdk-download.log" 2>&1
          python - <<'PYSDK' | tee "$GITHUB_WORKSPACE/native-logs/sdk-layout.log"
          import base64, hashlib, json, os, pathlib, zipfile
          spec = json.loads(pathlib.Path('source/docs/recovery/basic-pitch-native-20261121.json').read_text())['sdk']
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'onnxruntime.nupkg'
          h256, h512 = hashlib.sha256(), hashlib.sha512()
          with archive.open('rb') as f:
              for chunk in iter(lambda: f.read(1048576), b''):
                  h256.update(chunk); h512.update(chunk)
          assert archive.stat().st_size == spec['bytes'], 'SDK size mismatch'
          assert base64.b64encode(h512.digest()).decode() == spec['sha512_base64'], 'SDK hash mismatch'
          sdk = archive.parent / 'onnxruntime-linux-x64-1.20.1'
          (sdk / 'include').mkdir(parents=True)
          (sdk / 'lib').mkdir()
          with zipfile.ZipFile(archive) as z:
              for member in z.namelist():
                  if member.startswith('build/native/include/') and member.endswith('.h'):
                      target = sdk / 'include' / pathlib.PurePosixPath(member).name
                  elif member.startswith('runtimes/linux-x64/native/') and member.endswith('.so'):
                      target = sdk / 'lib' / pathlib.PurePosixPath(member).name
                  else:
                      continue
                  target.write_bytes(z.read(member))
                  print(member, '->', target.name)
          for soname in ('libonnxruntime.so.1', 'libonnxruntime.so.1.20.1'):
              (sdk / 'lib' / soname).symlink_to('libonnxruntime.so')
          assert (sdk / 'include/onnxruntime_cxx_api.h').is_file()
          assert (sdk / 'lib/libonnxruntime.so').is_file()
          log = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'native-logs/sdk-sha256.txt'
          log.write_text(h256.hexdigest() + '  onnxruntime.nupkg\n')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ORT_SDK_SHA256=' + h256.hexdigest() + '\n')
          print('Pinned SHA512 verified; SHA256', h256.hexdigest())
          PYSDK
      - name: Build standalone native harness
        working-directory: source
        run: |
          set -euo pipefail
          cmake -S native/neural -B "$GITHUB_WORKSPACE/native-build" -DCMAKE_BUILD_TYPE=Release -DORT_ROOT="$RUNNER_TEMP/onnxruntime-linux-x64-1.20.1" 2>&1 | tee "$GITHUB_WORKSPACE/native-logs/configure.log"
          cmake --build "$GITHUB_WORKSPACE/native-build" --parallel 2 2>&1 | tee "$GITHUB_WORKSPACE/native-logs/build.log"
      - name: Check native mechanics and report gates
        working-directory: source
        run: |
          set -euo pipefail
          ctest --test-dir "$GITHUB_WORKSPACE/native-build" --output-on-failure 2>&1 | tee "$GITHUB_WORKSPACE/native-logs/native-tests.log"
          python -m unittest tests.test_basic_pitch_native tests.test_basic_pitch_streaming tests.test_basic_pitch_cached_diagnosis tests.test_pitch_detector_comparison tests.test_midi_lifecycle_analysis 2>&1 | tee "$GITHUB_WORKSPACE/native-logs/python-tests.log"
      - name: Download existing pinned inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-inputs"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern recovery-inputs.tar.gz --dir "$RUNNER_TEMP/m3-inputs" > "$GITHUB_WORKSPACE/native-logs/input-download.log" 2>&1
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" | sha256sum --check | tee "$GITHUB_WORKSPACE/native-logs/input-hash.log"
          tar -xzf "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" -C "$RUNNER_TEMP/m3-inputs"
      - name: Measure actual native worker and callback delivery once per recording
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          set -euo pipefail
          python -m tools.portable_basic_pitch_native \
            --spec-path docs/recovery/basic-pitch-native-20261121.json \
            --inputs "$RUNNER_TEMP/m3-inputs" \
            --model-checkout "$GITHUB_WORKSPACE/basic-pitch" \
            --harness "$GITHUB_WORKSPACE/native-build/neural_ort_harness" \
            --output "$GITHUB_WORKSPACE/basic-pitch-native-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/native-logs/measurement.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-basic-pitch-native-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            basic-pitch-native-result/report/
            basic-pitch-native-result/logs/
            native-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain generated native evidence remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-basic-pitch-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: basic-pitch-native-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
