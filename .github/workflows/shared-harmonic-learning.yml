name: Shared harmonic classifier screen
run-name: 'Shared harmonic classifier / ${{ inputs.source_sha }}'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source commit for one shared harmonic classifier screen
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-private-processing
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check bounded dispatch inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/shared-harmonic-logs"
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin source and CPU dependencies
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$GITHUB_WORKSPACE/shared-harmonic-logs/source-sha.txt"
          test "$(cat "$GITHUB_WORKSPACE/shared-harmonic-logs/source-sha.txt")" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 scikit-learn==1.7.2 joblib==1.5.2 soundfile==0.13.1 2>&1 | tee "$GITHUB_WORKSPACE/shared-harmonic-logs/dependencies.log"
          python -m pip freeze --all > "$GITHUB_WORKSPACE/shared-harmonic-logs/environment.txt"
      - name: Check synthetic features, shared fit, source isolation, clocks and scoring
        working-directory: source
        run: |
          set -euo pipefail
          python -m unittest tests.test_shared_harmonic_learning tests.test_portable_shared_harmonic_learning tests.test_direct_spectrum_learning tests.test_portable_direct_spectrum_learning tests.test_spectral_dictionary tests.test_spectral_ablation tests.test_pitch_detector_comparison 2>&1 | tee "$GITHUB_WORKSPACE/shared-harmonic-logs/tests.log"
      - name: Fit one shared classifier; continuous replay only after held-out pass
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.portable_shared_harmonic_learning \
            --spec docs/recovery/shared-harmonic-learning-20261121.json \
            --output "$GITHUB_WORKSPACE/shared-harmonic-result" \
            2>&1 | tee "$GITHUB_WORKSPACE/shared-harmonic-logs/screen.log"
      - name: Retain small report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-shared-harmonic-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shared-harmonic-result/report/
            shared-harmonic-result/logs/
            shared-harmonic-logs/
          retention-days: 14
          if-no-files-found: error
      - name: Retain model and predictions remotely
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-shared-harmonic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared-harmonic-result/bulk/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
