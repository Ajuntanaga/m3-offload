name: M3 ordinary attack envelope
run-name: 'Ordinary attack envelope / ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full pinned observation commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: m3-ordinary-attack-envelope
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  SOURCE_SHA: ${{ inputs.source_sha }}
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check destination and source selection
        run: |
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare the pinned numerical runtime
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p build/github-results
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'soundfile==0.13.1' 'scipy==1.11.4' 2>&1 | tee build/github-results/ordinary-attack-envelope-dependencies.log
      - name: Fetch existing pinned corpus and event ledger
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download corpus-20261108 --repo Ajuntanaga/m3-offload --pattern recovery-inputs.tar.gz --dir "$RUNNER_TEMP"
          printf '%s  %s\n' adf6e36f2883538cfa3b0500ca0d936ed64fc6a1e12aeae3bd89e40dbf7c4254 "$RUNNER_TEMP/recovery-inputs.tar.gz" | sha256sum --check
          gh api repos/Ajuntanaga/m3-offload/actions/artifacts/14326876824/zip > "$RUNNER_TEMP/m3-stable-note-ledger.zip"
          printf '%s  %s\n' 04970b0b0dd87d24328e769a269423895ddd2b2156ca27bb903d6f537e9b5663 "$RUNNER_TEMP/m3-stable-note-ledger.zip" | sha256sum --check
      - name: Test event identity and population contracts
        working-directory: source
        run: |
          python -B -m unittest tests.test_ordinary_attack_envelope 2>&1 | tee build/github-results/ordinary-attack-envelope-contracts.log
      - name: Observe the frozen ordinary attack population once
        working-directory: source
        run: |
          python -B -m tools.portable_ordinary_attack_envelope \
            --source-sha "$SOURCE_SHA" \
            --spec docs/recovery/ordinary-attack-envelope-20261123.json \
            --corpus-archive "$RUNNER_TEMP/recovery-inputs.tar.gz" \
            --ledger-archive "$RUNNER_TEMP/m3-stable-note-ledger.zip" \
            --output build/github-results/ordinary-attack-envelope \
            2>&1 | tee build/github-results/ordinary-attack-envelope.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-ordinary-attack-envelope-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            source/build/github-results/ordinary-attack-envelope/report.json
            source/build/github-results/ordinary-attack-envelope*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-ordinary-attack-envelope-curves-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: source/build/github-results/ordinary-attack-envelope/envelope-curves.json.gz
